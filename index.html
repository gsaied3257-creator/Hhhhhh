<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي الأسئلة</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    font-family: Tahoma, Arial, sans-serif;
    background:#000000;
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .stage{
    width:100%;
    max-width:480px;
  }
  .screen{display:none;}
  .screen.active{display:block;}

  h1{
    text-align:center;
    font-size:28px;
    margin:0 0 10px;
  }
  h2{
    text-align:center;
    font-size:20px;
    margin:0 0 16px;
  }
  p{
    text-align:center;
    color:#ffffff;
  }

  label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
  }
  textarea{
    width:100%;
    min-height:120px;
    margin-bottom:16px;
    padding:8px;
    font-family:inherit;
    font-size:14px;
    background:#000000;
    color:#ffffff;
    border:1px solid #ffffff;
  }

  button{
    display:block;
    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:16px;
    cursor:pointer;
    background:#ffffff;
    color:#000000;
    border:1px solid #ffffff;
  }
  .btn-row{
    display:flex;
    gap:10px;
  }
  .btn-row button{margin-top:10px;}

  .error-msg{
    color:#ffffff;
    font-weight:bold;
    text-align:center;
    min-height:18px;
  }

  .progress{
    text-align:center;
    margin-bottom:10px;
  }
  .box{
    border:1px solid #ffffff;
    padding:20px;
    text-align:center;
    margin-bottom:10px;
    font-size:18px;
    color:#ffffff;
  }
</style>
</head>
<body>

<div class="stage">

  <!-- SCREEN 1: START -->
  <section class="screen active" id="screen-start">
    <h1>تحدي الأسئلة</h1>
    <p>جاوب على السؤال أو خد عقاب</p>
    <button id="btn-goto-setup">ابدأ</button>
  </section>

  <!-- SCREEN 2: SETUP -->
  <section class="screen" id="screen-setup">
    <h2>جهّز اللعبة</h2>
    <label for="input-questions">الأسئلة</label>
    <textarea id="input-questions" placeholder="1- سؤال
2- سؤال
3- سؤال"></textarea>

    <label for="input-punishments">العقاب</label>
    <textarea id="input-punishments" placeholder="1- عقاب
2- عقاب
3- عقاب"></textarea>

    <div class="error-msg" id="setup-error"></div>
    <button id="btn-start-game">ابدأ اللعبة</button>
  </section>

  <!-- SCREEN 3: PLAY -->
  <section class="screen" id="screen-play">
    <div class="progress" id="progress-label"></div>

    <div class="box" id="question-panel">
      <div id="question-text"></div>
    </div>
    <div class="btn-row" id="question-actions">
      <button id="btn-try">جاوبت</button>
      <button id="btn-punish">عقاب</button>
    </div>

    <div class="box" id="punishment-panel" style="display:none;">
      <div id="punishment-text"></div>
    </div>
    <div class="btn-row" id="punishment-actions" style="display:none;">
      <button id="btn-done">تم التنفيذ</button>
      <button id="btn-punish-again">انا مش قده</button>
    </div>
  </section>

  <!-- SCREEN 4: END -->
  <section class="screen" id="screen-end">
    <h2>خلصت الأسئلة</h2>
    <button id="btn-restart">لعب من جديد</button>
  </section>

</div>

<script>
  (function(){
    const screens = {
      start: document.getElementById('screen-start'),
      setup: document.getElementById('screen-setup'),
      play: document.getElementById('screen-play'),
      end: document.getElementById('screen-end'),
    };

    function showScreen(name){
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[name].classList.add('active');
    }

    function parseNumberedList(raw){
      return raw.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => {
          const m = line.match(/^\d+\s*[-.)：:]?\s*(.+)$/);
          return m ? m[1].trim() : line;
        })
        .filter(text => text.length > 0);
    }

    let questions = [];
    let punishments = [];
    let currentIndex = 0;
    let lastPunishment = null;

    document.getElementById('btn-goto-setup').addEventListener('click', () => {
      showScreen('setup');
    });

    document.getElementById('btn-start-game').addEventListener('click', () => {
      const qRaw = document.getElementById('input-questions').value;
      const pRaw = document.getElementById('input-punishments').value;
      const errorBox = document.getElementById('setup-error');

      questions = parseNumberedList(qRaw);
      punishments = parseNumberedList(pRaw);

      if (questions.length === 0 || punishments.length === 0){
        errorBox.textContent = 'فين السوال .';
        return;
      }
      errorBox.textContent = '';
      currentIndex = 0;
      showQuestion();
      showScreen('play');
    });

    function showQuestion(){
      document.getElementById('question-panel').style.display = 'block';
      document.getElementById('question-actions').style.display = 'flex';
      document.getElementById('punishment-panel').style.display = 'none';
      document.getElementById('punishment-actions').style.display = 'none';

      document.getElementById('progress-label').textContent =
        `سؤال ${currentIndex + 1} من ${questions.length}`;
      document.getElementById('question-text').textContent = questions[currentIndex];
    }

    function pickPunishment(){
      if (punishments.length === 1){
        lastPunishment = punishments[0];
        return lastPunishment;
      }
      let choice;
      do{
        choice = punishments[Math.floor(Math.random() * punishments.length)];
      } while (choice === lastPunishment);
      lastPunishment = choice;
      return choice;
    }

    function showPunishment(){
      document.getElementById('question-panel').style.display = 'none';
      document.getElementById('question-actions').style.display = 'none';
      document.getElementById('punishment-panel').style.display = 'block';
      document.getElementById('punishment-actions').style.display = 'flex';
      document.getElementById('punishment-text').textContent = pickPunishment();
    }

    function goToNextQuestion(){
      currentIndex++;
      if (currentIndex >= questions.length){
        showScreen('end');
      } else {
        showQuestion();
      }
    }

    document.getElementById('btn-try').addEventListener('click', goToNextQuestion);
    document.getElementById('btn-punish').addEventListener('click', showPunishment);
    document.getElementById('btn-punish-again').addEventListener('click', showPunishment);
    document.getElementById('btn-done').addEventListener('click', goToNextQuestion);

    document.getElementById('btn-restart').addEventListener('click', () => {
      document.getElementById('input-questions').value = '';
      document.getElementById('input-punishments').value = '';
      showScreen('start');
    });
  })();
</script>

</body>
</html>
